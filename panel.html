<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontrol Paneli</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --zemin:#0d0d0d; --yuzey:#1a1a19; --yuzey2:#222220; --kenar:#2e2e2c;
  --yazi:#e8e8e6; --yazi2:#a8a8a4; --yazi3:#6f6f6b;
  --iyi:#2fb344; --kotu:#e05252; --uyari:#e3a008; --vurgu:#3987e5; --izgara:#242422;
}
:root[data-tema="acik"]{
  --zemin:#f6f6f4; --yuzey:#ffffff; --yuzey2:#f0f0ed; --kenar:#dcdcd6;
  --yazi:#1a1a19; --yazi2:#55554f; --yazi3:#8a8a83;
  --iyi:#1a7f2e; --kotu:#c02d2d; --uyari:#a97400; --vurgu:#1b63b8; --izgara:#e6e6e1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--zemin);color:var(--yazi);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:13.5px;margin:0 0 12px;font-weight:650;color:var(--yazi);letter-spacing:-.005em}
h3{font-size:11px;margin:18px 0 8px;font-weight:600;color:var(--yazi3);
  text-transform:uppercase;letter-spacing:.08em}

.ust{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--yuzey) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--kenar);
  padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ust .bosluk{flex:1}
.rozet{display:inline-block;padding:2.5px 10px;border-radius:99px;font-size:10.5px;font-weight:600;
  border:1px solid var(--kenar);background:var(--yuzey2);color:var(--yazi2);
  letter-spacing:.03em;vertical-align:middle}
.rozet.iyi{color:var(--iyi);border-color:color-mix(in srgb,var(--iyi) 45%,transparent);
  background:color-mix(in srgb,var(--iyi) 12%,transparent)}
.rozet.kotu{color:var(--kotu);border-color:color-mix(in srgb,var(--kotu) 45%,transparent);
  background:color-mix(in srgb,var(--kotu) 12%,transparent)}
.rozet.uyari{color:var(--uyari);border-color:color-mix(in srgb,var(--uyari) 45%,transparent);
  background:color-mix(in srgb,var(--uyari) 12%,transparent)}
button{font:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--kenar);background:var(--yuzey2);color:var(--yazi);
  transition:border-color .13s,background .13s,transform .06s}
button:hover{border-color:var(--vurgu);background:var(--yuzey)}
button:active{transform:translateY(1px)}

.sekmeler{position:sticky;top:45px;z-index:39;display:flex;gap:2px;padding:0 18px;
  background:var(--zemin);border-bottom:1px solid var(--kenar);overflow-x:auto}
.sekme{padding:9px 14px;font-size:13px;cursor:pointer;border:none;background:none;
  color:var(--yazi3);border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}
.sekme:hover{color:var(--yazi2)}
.sekme.aktif{color:var(--yazi);border-bottom-color:var(--vurgu);font-weight:600}
.sekme .kisayol{font-size:10px;color:var(--yazi3);margin-left:5px}

main{padding:20px 20px 80px;max-width:1560px}
.panel{display:none}
.panel.aktif{display:block;animation:gir .18s ease-out}
@keyframes gir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
section{background:var(--yuzey);border:1px solid var(--kenar);border-radius:14px;
  padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kart{background:var(--yuzey);border:1px solid var(--kenar);border-radius:12px;padding:13px 15px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);transition:border-color .13s}
.kart:hover{border-color:color-mix(in srgb,var(--vurgu) 35%,var(--kenar))}
.kart .etiket{font-size:10.5px;color:var(--yazi3);margin-bottom:6px;letter-spacing:.02em}
.kart .deger{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kart .alt{font-size:10.5px;color:var(--yazi3);margin-top:4px}

.tablo-sar{overflow-x:auto;-webkit-overflow-scrolling:touch;
  border-radius:10px;border:1px solid var(--izgara)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--yazi3);font-weight:600;font-size:10px;padding:8px 11px;
  border-bottom:1px solid var(--kenar);white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;
  background:var(--yuzey2);position:sticky;top:0}
td{padding:7px 11px;border-bottom:1px solid var(--izgara);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--yuzey2)}
td.sag,th.sag{text-align:right}
.bos{color:var(--yazi3);font-size:12.5px;padding:14px 2px}

.iyi{color:var(--iyi)} .kotu{color:var(--kotu)} .uyari{color:var(--uyari)} .sonuk{color:var(--yazi3)}

.anlati p{margin:0 0 9px;font-size:14.5px;line-height:1.65;max-width:74ch}
.anlati p:last-child{margin-bottom:0}
.maddeler{list-style:none;padding:0;margin:12px 0 0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:5px 18px}
.maddeler li{font-size:13px;display:flex;align-items:center;gap:8px}
.nokta{width:8px;height:8px;border-radius:99px;flex:none;background:var(--yazi3)}
.nokta.iyi{background:var(--iyi)} .nokta.kotu{background:var(--kotu)} .nokta.uyari{background:var(--uyari)}

/* terim: TIKLA-AC/KAPA (2026-08-05, kullanici: "ustune basinca acilip kapansin") */
[data-terim]{border-bottom:1px dashed var(--yazi3);cursor:pointer;transition:color .12s}
[data-terim]:hover{color:var(--vurgu);border-bottom-color:var(--vurgu)}
[data-terim]::after{content:"ⓘ";font-size:.78em;opacity:.45;margin-left:2px;vertical-align:super}
[data-terim].acik{color:var(--vurgu);border-bottom-color:var(--vurgu)}
[data-terim].acik::after{opacity:1}
#ipucu{position:fixed;z-index:100;max-width:360px;background:var(--yuzey2);color:var(--yazi);
  border:1px solid var(--kenar);border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.6;
  box-shadow:0 12px 40px rgba(0,0,0,.5);display:none}
#ipucu .ad{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--vurgu);margin-bottom:7px;padding-right:22px}
#ipucu .yorum{margin-top:9px;padding-top:9px;border-top:1px solid var(--kenar);color:var(--yazi2)}
#ipucu .kapat{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--yazi3);
  font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
#ipucu .kapat:hover{color:var(--yazi);background:var(--kenar)}

/* grafik gostergesi (legend) */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11.5px;align-items:center}
.legend span.oge{display:inline-flex;align-items:center;gap:6px;color:var(--yazi2)}
.legend i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block;flex:none}
.legend i.kesik{border-top-style:dashed}
.legend i.kutu{height:11px;border:none;border-radius:2px;width:11px}

.grafik{height:210px}
.satir{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.cubuk{height:9px;background:var(--vurgu);border-radius:3px;min-width:2px}
.not{font-size:11.5px;color:var(--yazi3);margin-top:9px;line-height:1.55}
.zaman{border-left:2px solid var(--kenar);padding-left:16px;margin-left:5px}
.olay{margin-bottom:14px;position:relative}
.olay::before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;
  border-radius:99px;background:var(--kenar)}
.olay.d2::before{background:var(--vurgu);width:10px;height:10px;left:-22px}
.olay .bas{font-weight:600;font-size:13px}
.olay .gov{font-size:12px;color:var(--yazi2);margin-top:3px}
.ayar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--izgara)}
.ayar .ad{font-size:13px;font-weight:500}
.ayar .ack{font-size:11.5px;color:var(--yazi3);margin-top:2px;max-width:72ch}
.ayar input{width:105px;font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;
  border:1px solid var(--kenar);background:var(--zemin);color:var(--yazi);text-align:right}
#tost{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--yuzey2);border:1px solid var(--kenar);border-radius:9px;padding:10px 18px;
  font-size:13px;display:none;box-shadow:0 8px 26px rgba(0,0,0,.45);max-width:80vw}
</style>
</head>
<body>

<div class="ust">
  <h1>Kontrol Paneli</h1>
  <span id="botDurum" class="rozet">…</span>
  <span id="ustOzet" class="sonuk" style="font-size:12px"></span>
  <span class="bosluk"></span>
  <span id="yenilendi" class="sonuk" style="font-size:11px"></span>
  <button onclick="hepsiniYenile()">Yenile <span class="sonuk">R</span></button>
  <button onclick="temaDegis()">Tema</button>
</div>

<div class="sekmeler" id="sekmeler"></div>
<main id="govde"></main>
<div id="ipucu"></div>
<div id="tost"></div>

<script>
/* =========================================================================
   TERİM SÖZLÜĞÜ — panelin her yerinde data-terim="x" ile kullanılır.
   Üstüne gelince: ne demek + (varsa) o anki değerin ne anlama geldiği.
   Tanımlar koddaki hesaplama yerlerinden çıkarıldı (radar.py / olcucu.py /
   testbot.py / evren.py) ve bu projede yapılan ölçümlerin sonuçlarını içerir.
   ========================================================================= */
const TERIMLER = {
  funding:{ad:"Fonlama oranı",
    ack:"Vadeli işlemde 8 saatte bir taraflardan birinin diğerine ödediği ücret. Artı = long'lar short'lara ödüyor (kalabalık long tarafında). Eksi = tersi.",
    yorum:v=>v==null?null:(v<-0.01?"Eksi: kalabalık short tarafında. Tek başına yön vermiyor — ölçüldü.":(v>0.03?"Belirgin artı: kalabalık long tarafında, aşırılık işareti.":"Normal aralıkta."))},
  oi:{ad:"Açık pozisyon (OI)",
    ack:"O coinde açık duran toplam vadeli sözleşme miktarı. Artması yeni para girdiğini, azalması pozisyonların kapandığını gösterir. Fiyattan bağımsız bir 'ilgi' ölçüsü."},
  oi24:{ad:"Açık pozisyon değişimi (24 saat)",
    ack:"Son 24 saatte açık pozisyonun yüzde değişimi. Botun skorunun EN AĞIR bileşeni — skor otopsisinde çıktı ki skor pratikte ağırlıklı olarak bunu ölçüyor.",
    yorum:v=>v==null?null:(v>20?"Çok hızlı artış — skoru büyük ölçüde bu şişiriyor.":(v<0?"Azalıyor: pozisyonlar kapanıyor.":"Ilımlı artış."))},
  oi3:{ad:"Açık pozisyon değişimi (3 saat)",
    ack:"Son 3 saatteki açık pozisyon değişimi. Ani ilgi patlamasını yakalamak için."},
  comp:{ad:"Sıkışma",
    ack:"Son 6 mumun oynaklığı / 14 mumluk ortalama oynaklık. 1'in altı = fiyat daralıyor ('yay geriliyor').",
    yorum:v=>v==null?null:(v<0.65?"Belirgin sıkışma. NOT: 14.000 gözlemde ölçüldü — sessizlik patlama habercisi DEĞİL, sessiz sessiz kalıyor.":"Normal oynaklık.")},
  vol_x:{ad:"Hacim katsayısı",
    ack:"Son mumun işlem hacmi / son 24 mumun ortanca hacmi. 3 = normalin üç katı hacim.",
    yorum:v=>v==null?null:(v>3?"Hacim patlaması.":(v>1.5?"Hacim normalin üstünde.":"Sıradan hacim."))},
  pos:{ad:"Aralıktaki konum",
    ack:"Son 20 mumun en yüksek–en düşük aralığında fiyatın yeri. 1 = tepe, 0 = dip.",
    yorum:v=>v==null?null:(v>0.8?"Aralığın tepesinde. Ölçüm: buradan short açmak geometrik olarak dezavantajlı — stop çok dar kalıyor.":(v<0.2?"Aralığın dibinde — düşen bıçak riski.":"Orta bölge."))},
  last1:{ad:"Son 1 saat değişimi", ack:"Fiyatın son bir saatteki yüzde değişimi."},
  last3:{ad:"Son 3 saat değişimi",
    ack:"Fiyatın son üç saatteki yüzde değişimi.",
    yorum:v=>v==null?null:(v>4?"Belirgin yükseliş. Ölçüm: çok yükselmiş coini short'lamak iki yarıda da kötü çıktı.":null)},
  skor:{ad:"Radar skoru (0–100)",
    ack:"Beş bileşenin toplamı: açık pozisyon (35), fonlama (23), sıkışma (20), hacim (20), kırılım (15). Otopside çıktı ki sıkışma ve kırılım neredeyse hiç puan üretmiyor — skor fiilen bir açık pozisyon dedektörü.",
    yorum:v=>v==null?null:(v>=60?"Yüksek. Ama ölçüm: yüksek skor daha iyi işlem demek değil — skorun ateşlediği an, o coin için ölçülen anlar arasında en kötülerinden biri.":(v>=45?"Botun işlem eşiğinin üstünde.":"Eşik altı, sadece izleniyor."))},
  stage:{ad:"Aşama",
    ack:"BAŞLIYOR = hacim, ivme ve açık pozisyon birlikte sıçradı. HAZIRLANIYOR = sıkışmış ama henüz kıpırdamamış. izle = ikisi de değil. Ölçüm: BAŞLIYOR aslında EN KÖTÜ hücre (ort. R −0,09), HAZIRLANIYOR en iyisi (+0,19)."},
  smart:{ad:"Akıllı para etiketi",
    ack:"Büyük yatırımcıların long/short pozisyon oranından türetilir. 1,2 üstü LONG, 0,83 altı SHORT, arası NÖTR. Bir tahmin değil — sadece kalabalığın nerede durduğunun etiketi."},
  taker:{ad:"Agresif alıcı oranı",
    ack:"Piyasa emriyle ALAN / SATAN oranı. 1 üstü = alıcılar sabırsız, bekleyemeyip piyasadan alıyor. Bot short açmadan önce bunun soğumasını (1,05 altına inmesini) bekler."},
  top_ls:{ad:"Büyük hesapların long/short oranı",
    ack:"Borsanın en büyük pozisyon sahiplerinin long/short dengesi. 1'in üstü long ağırlıklı."},
  glob_ls:{ad:"Tüm hesapların long/short oranı",
    ack:"Bütün kullanıcıların long/short dengesi — perakende göstergesi. Büyük hesaplarla ayrıştığında dikkat çekici."},
  float_oran:{ad:"Dolaşım oranı",
    ack:"Piyasada dolaşan arz / toplam arz. Düşük olması ileride büyük miktarda kilit açılacağı (satış baskısı) anlamına gelir.",
    yorum:v=>v==null?null:(v<0.25?"Düşük dolaşım — kilit açılma riski taşıyor.":"Normal.")},
  dip_yakit:{ad:"Dip yakıtı (UYARI)",
    ack:"Çok negatif fonlama + dipte fiyat. ESKİDEN 'yukarı sıçrama yakıtı' diye okunuyordu; 2026-08-03'te ölçüldü ve anlamı TERSİNE döndü: bu bir düşüşe devam uyarısı. Hesap aynı bırakıldı, sadece okuması değişti."},
  rel3:{ad:"BTC'ye göre güç (3 saat)",
    ack:"Coinin 3 saatlik değişimi eksi BTC'nin 3 saatlik değişimi. Artı = BTC'den iyi performans.",
    yorum:v=>v==null?null:(v>3?"BTC'yi belirgin geçmiş. Ölçüm: bu grup short için kötü — iki yarıda da.":null)},
  ayrisma:{ad:"Ayrışma",
    ack:"Coin yükselirken BTC yatay/düşüyorsa işaretlenir. Deneysel etiket, kapı değil — ayı rejiminde negatif çıktı."},
  atr:{ad:"ATR (ortalama gerçek aralık)",
    ack:"Fiyatın 'normal' oynama miktarı. Stop mesafesi ve pozisyon boyutu bunun üstüne kurulur: yüksek ATR = geniş stop = küçük pozisyon."},
  r:{ad:"R (risk birimi)",
    ack:"1R = giriş ile stop arasındaki mesafe, yani o işlemde göze alınan para. +2R = riskin iki katı kazanç. Farklı büyüklükteki işlemleri adil kıyaslamanın tek yolu.",
    yorum:v=>v==null?null:(v>0?"Ortalama pozitif: risk birimi başına kazanıyor.":"Ortalama negatif: risk birimi başına kaybediyor.")},
  stop:{ad:"Stop",
    ack:"Zarar kesme fiyatı. Üç adaydan (yapısal dip/tepe, son 10 mumun ucu, 1,5×ATR) girişe EN YAKIN olanı seçilir. 12 aylık ölçümde bu 'en dar' tercih doğrulandı — geniş stop edge üretmiyor, sadece dönemin yönünü büyütüyor."},
  tp:{ad:"TP1 / TP2 (kâr alma)",
    ack:"TP1'de pozisyonun bir kısmı kapatılır, kalanı TP2'ye bırakılır. TP1 = en yakın yapısal direnç ile 1,5R'nin yakın olanı; TP2 = TP1 + 1,5R."},
  trailing:{ad:"İz süren stop",
    ack:"Pozisyon 1R kâra geçince stop yukarı çekilmeye başlar, asla başabaşın altına inmez. NOT: girişten itibaren iz süren stop ölçümde çok kötü çıktı (%100 stop yeme); buradaki kâra geçtikten SONRA devreye giren sürüm farklı."},
  notional:{ad:"Pozisyon büyüklüğü",
    ack:"Teminat × kaldıraç. Piyasada fiilen tuttuğun toplam değer."},
  marjin:{ad:"Teminat",
    ack:"Pozisyon için ayrılan para. Kaybedilebilecek üst sınır bu değil — asıl sınır stop mesafesiyle belirlenen risk."},
  kaldirac:{ad:"Kaldıraç",
    ack:"Artık bir GİRDİ değil SONUÇ: önce 'kaç dolar riske gireceğim' belirlenir, stop mesafesine bölünür, çıkan pozisyon büyüklüğü için gereken kaldıraç hesaplanır. 2026-08-03 onarımı — öncesinde geniş stoplu işlemler en büyük riski alıyordu."},
  likidasyon:{ad:"Likidasyon fiyatı",
    ack:"Teminatın tamamen silineceği fiyat. Sistem stopun her zaman bundan ÖNCE tetiklenmesini garanti eder."},
  risk_usdt:{ad:"İşlem riski",
    ack:"Stop yenirse kaybedilecek dolar. Hedef, bakiyenin sabit bir yüzdesi — hangi coin olursa olsun aynı."},
  slipaj:{ad:"Slipaj",
    ack:"Emrin istediğin fiyattan değil biraz kötüsünden gerçekleşmesi. Hesaplara %0,02 katılıyor; düşük hacimli coinlerde gerçekte daha fazladır."},
  spread:{ad:"Makas",
    ack:"En iyi alış ile en iyi satış fiyatı arasındaki fark. Girer girmez ödenen gizli maliyet."},
  basis:{ad:"Baz farkı",
    ack:"Vadeli fiyat ile spot fiyat arasındaki fark. Spot mu vadeli mi önde gidiyor sorusunun ölçüsü."},
  equity:{ad:"Bakiye",
    ack:"Sanal hesabın toplam değeri: gerçekleşen kâr/zarar + ödenen ücretler + fonlama dahil. Bu yüzden işlem listesindeki toplamdan farklı olabilir."},
  drawdown:{ad:"Zirveden düşüş",
    ack:"Bakiyenin gördüğü en yüksek noktadan yüzde kaç geri çekildiği. En kötü değeri, sistemin sana yaşattığı en zor an."},
  winrate:{ad:"Kazanma oranı",
    ack:"Kazanan işlem / toplam işlem. TEK BAŞINA anlamsız: %30 ile kâr edilebilir, %70 ile batılabilir. Ortalama R ile birlikte okunmalı."},
  rejim:{ad:"Rejim (F10)",
    ack:"İki katmanın kesişimi. MEVSİM: BTC'nin haftalık kapanışı son 20 haftanın ortalamasının üstünde mi (yavaş). HAVA: günlük 20 ortalamaya göre, %2 ölü bant ve 3 gün gecikmeyle (hızlı). Kesişimler: tam boğa / tepki rallisi / derin ayı / boğa düzeltmesi / belirsiz."},
  sezon:{ad:"Mevsim",
    ack:"BTC'nin haftalık kapanışı son 20 haftanın ortalamasının üstünde mi ve eğim yukarı mı. Yavaş değişir — bilerek. Kısa vadeli sahte dönüşleri görmemek için tasarlandı."},
  hava:{ad:"Hava",
    ack:"Günlük 20 ortalamaya göre hızlı katman. %2'lik ölü bant ve 3 günlük gecikme, kıl payı sinyallerin savrulmasını engelliyor."},

/* ---- ipucu motoru: TIKLA-AC / TIKLA-KAPA ----
   Hover yerine tiklama (kullanici karari): metin secilebilir/kopyalanabilir kalir,
   okurken kaybolmaz, dokunmatikte de calisir. Ayni terime tekrar basinca kapanir. */
const ipucu = document.getElementById('ipucu');
let ipucuAcikEl = null;
function ipucuGoster(el){
  const t = TERIMLER[el.dataset.terim]; if(!t) return;
  let h = '<div class="kapat" onclick="ipucuGizle()">×</div><div class="ad">'+t.ad+'</div><div>'+t.ack+'</div>';
  if(t.yorum && el.dataset.deger!==undefined && el.dataset.deger!=='' && el.dataset.deger!=='null'){
    const y = t.yorum(parseFloat(el.dataset.deger));
    if(y) h += '<div class="yorum"><b>Şu an:</b> '+y+'</div>';
  }
  ipucu.innerHTML = h; ipucu.style.display='block';
  if(ipucuAcikEl) ipucuAcikEl.classList.remove('acik');
  el.classList.add('acik'); ipucuAcikEl = el;
  const r = el.getBoundingClientRect(), k = ipucu.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  if(x + k.width > innerWidth - 12) x = innerWidth - k.width - 12;
  if(y + k.height > innerHeight - 12) y = r.top - k.height - 8;
  ipucu.style.left = Math.max(8,x)+'px'; ipucu.style.top = Math.max(8,y)+'px';
}
function ipucuGizle(){
  ipucu.style.display='none';
  if(ipucuAcikEl){ ipucuAcikEl.classList.remove('acik'); ipucuAcikEl=null; }
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-terim]');
  if(el){ e.preventDefault(); e.stopPropagation();
    if(ipucuAcikEl===el) ipucuGizle(); else ipucuGoster(el); return; }
  if(!e.target.closest('#ipucu')) ipucuGizle();
});
addEventListener('keydown', e=>{ if(e.key==='Escape') ipucuGizle(); });
document.addEventListener('scroll', ipucuGizle, true);

/* ---- yardımcılar ---- */
const $ = s => document.querySelector(s);
const n2 = v => (v==null||v===''||isNaN(v)) ? '–' : (+v).toFixed(2);
const n1 = v => (v==null||v===''||isNaN(v)) ? '–' : (+v).toFixed(1);
const para = v => (v==null||isNaN(v)) ? '–' : (+v).toLocaleString('tr-TR',{maximumFractionDigits:2});
const isar = v => (v==null||isNaN(v)) ? '' : (v>0?'+':'');
const snf  = v => (v==null||isNaN(v)) ? 'sonuk' : (v>0?'iyi':(v<0?'kotu':''));
const esc  = s => String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const T    = (k,v,metin)=>'<span data-terim="'+k+'"'+(v!=null?' data-deger="'+v+'"':'')+'>'+metin+'</span>';
const zam  = t => Math.floor(new Date(String(t).replace(' ','T')).getTime()/1000);
function tost(m,iyi){ const t=$('#tost'); t.textContent=m;
  t.style.borderColor = iyi?'var(--iyi)':'var(--kotu)'; t.style.display='block';
  clearTimeout(t._z); t._z=setTimeout(()=>t.style.display='none', 4500); }
function tablo(basliklar, satirlar, bosMesaj){
  if(!satirlar.length) return '<div class="bos">'+(bosMesaj||'Kayıt yok.')+'</div>';
  return '<div class="tablo-sar"><table><thead><tr>'+basliklar.join('')+'</tr></thead><tbody>'
    + satirlar.join('') + '</tbody></table></div>';
}
async function al(yol){ const r = await fetch(yol); return r.json(); }
async function gonder(yol, govde){
  const r = await fetch(yol,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(govde)});
  return r.json();
}
function seriHazirla(dizi, zamanAlan, degerAlan){
  return dizi.map(x=>({time: zam(x[zamanAlan]), value: x[degerAlan]}))
    .filter(x=>!isNaN(x.time) && x.value!=null)
    .sort((a,b)=>a.time-b.time)
    .filter((x,i,a)=> i===0 || x.time!==a[i-1].time);
}

function renk(ad){ return getComputedStyle(document.documentElement).getPropertyValue(ad).trim(); }
function temaUygula(t){ document.documentElement.dataset.tema = t; localStorage.setItem('tema', t);
  Object.values(grafikler).forEach(g=>{ try{ g.c.applyOptions(grafikSecenek()); }catch(e){} }); }
function temaDegis(){ temaUygula(document.documentElement.dataset.tema==='acik'?'koyu':'acik'); }
function grafikSecenek(){ return {
  layout:{background:{color:'transparent'},textColor:renk('--yazi3'),fontSize:11},
  grid:{vertLines:{color:renk('--izgara')},horzLines:{color:renk('--izgara')}},
  rightPriceScale:{borderColor:renk('--kenar')},
  timeScale:{borderColor:renk('--kenar'),timeVisible:true},
  crosshair:{mode:0} }; }
const grafikler = {};
function cizgiGrafik(ad, hedef, veri, c){
  const el = document.getElementById(hedef); if(!el || !veri.length) return;
  if(grafikler[ad]){ try{ grafikler[ad].c.remove(); }catch(e){} }
  const g = LightweightCharts.createChart(el, Object.assign(grafikSecenek(),
    {width:el.clientWidth, height:el.clientHeight}));
  const s = g.addAreaSeries({lineColor:c, topColor:c+'44', bottomColor:c+'05', lineWidth:2});
  s.setData(veri); g.timeScale().fitContent(); grafikler[ad]={c:g,s:s};
  new ResizeObserver(()=>{ try{ g.applyOptions({width:el.clientWidth,height:el.clientHeight}); }catch(e){} }).observe(el);
}

let aktifSekme = (location.hash.slice(1) || 'ozet').split('/')[0];

function sekmeAc(id){
  aktifSekme = id;
  // Derin baglanti korunur: "#coin/SOL/1h" ile acilirken hash'i "#coin"e indirgeme,
  // yoksa coinRota() sembolu okuyamaz ve bos coin sayfasi acilir.
  if((location.hash.slice(1)||'').split('/')[0] !== id) location.hash = id;
  document.querySelectorAll('.sekme').forEach(b=>b.classList.toggle('aktif', b.dataset.id===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('aktif', p.id==='p-'+id));
  const s = SEKMELER.find(x=>x.id===id);
  if(!s._son || (s.sure && Date.now()-s._son > s.sure*1000)) yenile(s);
}
async function yenile(s){
  const el = $('#p-'+s.id);
  if(!s._son) el.innerHTML = '<div class="bos">Yükleniyor…</div>';
  try{
    await s.yukle(el); s._son = Date.now();
    $('#yenilendi').textContent = 'son yenileme ' + new Date().toLocaleTimeString('tr-TR');
  }catch(e){ el.innerHTML = '<section><div class="bos kotu">Yüklenemedi: '+esc(e.message)+'</div></section>'; }
}
function hepsiniYenile(){ SEKMELER.forEach(s=>s._son=0); ustBar(); sekmeAc(aktifSekme); }
addEventListener('keydown', e=>{

  if(e.key==='r') hepsiniYenile();
});

async function mumGoster(sym){
  const b = $('#mumBaslik'); if(b) b.textContent = '— '+sym;
  const d = await al('/api/mumlar?sym='+sym+'&interval=15m&limit=200');
  if(d.error || !d.length) return;
  const el = document.getElementById('g-mum'); if(!el) return;
  if(grafikler.mum){ try{ grafikler.mum.c.remove(); }catch(e){} }
  const g = LightweightCharts.createChart(el, Object.assign(grafikSecenek(),
    {width:el.clientWidth, height:el.clientHeight}));
  const s = g.addCandlestickSeries({upColor:renk('--iyi'),downColor:renk('--kotu'),
    borderVisible:false, wickUpColor:renk('--iyi'), wickDownColor:renk('--kotu')});
  s.setData(d); g.timeScale().fitContent(); grafikler.mum={c:g,s:s};
  new ResizeObserver(()=>{ try{ g.applyOptions({width:el.clientWidth,height:el.clientHeight}); }catch(e){} }).observe(el);
}
async function pozKapat(sym){
  if(!confirm(sym+' pozisyonu ŞU ANKİ piyasa fiyatından kapatılsın mı?\n\nBu geri alınamaz.')) return;
  const r = await gonder('/api/kontrol',{eylem:'pozisyon_kapat', arg:sym});
  tost(r.mesaj, r.ok); if(r.ok) hepsiniYenile();
}

const VETO_AD = {long_veto:'Long vetosu', taker_soguma:'Alıcı hâlâ agresif',
  blowoff:'Aşırı yükselmiş', rr_veto:'Ödül/risk yetersiz', btc_pay_freni:'BTC payı freni'};
/* SURE UYARISI — SURE_DOLDU'ya girince bot YENI GIRIS ARAMAZ; bu, "bot neden girmiyor"
   sorusunun en sessiz cevabi olabilir, o yuzden sayfanin en ustunde. */
function sureCiz(s){
  if(!s) return '';
  const bitti = s.durum!=='AKTIF';
  const yakin = !s.sinirsiz && s.kalan_gun!=null && s.kalan_gun<=2;
  /* Sure sinirinin YERINE gecen koruma (2026-08-10): dusus freni. Her iki halde de gorunur. */
  const fren = (s.maks_dusus_pct>0 && s.dusus_pct!=null)
    ? ' · Düşüş freni: zirveden <b class="'+snf(s.dusus_pct)+'">'+n1(s.dusus_pct)+'%</b> '+
      '(fren %-'+n1(s.maks_dusus_pct)+')' : '';
  if(!bitti && !yakin) return '<div class="not" style="margin:0 0 10px">'+
    (s.sinirsiz ? 'Test süresi: <b>sınırsız</b> ('+n1(s.gecen_gun)+' gündür çalışıyor)'
                : 'Test süresi: '+n1(s.gecen_gun)+' / '+n1(s.sure_gun)+' gün')+fren+'</div>';
  return '<div style="margin:0 0 12px;padding:9px 11px;border-radius:6px;border:1px solid var(--cizgi);'+
    'border-left:3px solid var(--kotu)"><b>'+(bitti
      ? (s.durum==='HALT_DUSUS'
          ? 'DÜŞÜŞ FRENİ devrede — bot yeni giriş ARAMIYOR.'
          : 'Bot durumu: '+esc(s.durum)+' — yeni giriş ARAMIYOR.')
      : 'Test süresi dolmak üzere: '+n1(s.kalan_gun)+' gün kaldı.')+'</b>'+
    '<div class="sonuk" style="font-size:12px;margin-top:3px">'+
    (s.durum==='HALT_DUSUS'
      ? 'Açık pozisyonlar yönetilmeye devam ediyor. Gözden geçirdikten sonra '+
        '<b>python testbot.py --devam</b> ile açılır (zirve referansı sıfırlanır).'
      : n1(s.gecen_gun)+' / '+n1(s.sure_gun)+' gün. Açık pozisyonlar yönetilir ama YENİ giriş açılmaz.')+
    fren+'</div></div>';
}

/* GOLGE DEFTER (2026-08-10) — "bot girmediği sürece ölçemeyiz" sorununun cevabı.
   Bot bir girişi reddettiğinde aynı işlem gölgede sanal açılır; burada kapı bazında
   karnesi durur. ort R negatif = kapı haklı; pozitif = kapı para yakıyor OLABİLİR. */
function golgeCiz(g){
  if(!g) return '<section><h2>Gölge defter</h2><div class="bos">Henüz bir giriş reddedilmedi — '+
    'ilk redde defter kendiliğinden oluşur.</div></section>';
  const k = g.karne||[];
  return '<section><h2>'+T('golge',null,'Gölge defter — reddedilen girişler ne yapardı?')+'</h2>'+
    '<p class="sonuk" style="margin:0 0 10px">Botun kapıya takılan her girişi burada sanal '+
    'açılıyor ve <b>botun aynı çıkış kurallarıyla</b> takip ediliyor. Şu an <b>'+g.acik+
    '</b> açık gölge pozisyon var. Sanal kasa: $'+para(g.baslangic_bakiye)+' → $'+para(g.equity)+'.</p>'+
    (k.length? tablo(['<th>Kapı</th><th class="sag">İşlem</th><th class="sag">Kazanma</th>'+
        '<th class="sag">Ort R</th><th class="sag">Toplam R</th><th>Hüküm</th>'],
      k.map(x=>'<tr><td><b>'+esc(VETO_AD[x.kapi]||x.kapi)+'</b></td>'+
        '<td class="sag">'+x.n+'</td><td class="sag">'+n1(x.win_rate)+'%</td>'+
        '<td class="sag '+snf(x.ort_r)+'">'+isar(x.ort_r)+n2(x.ort_r)+'</td>'+
        '<td class="sag '+snf(x.toplam_r)+'">'+isar(x.toplam_r)+n1(x.toplam_r)+'</td>'+
        '<td class="sonuk" style="white-space:normal">'+(x.n<25
          ? 'N='+x.n+' → sadece izlenim'
          : (x.ort_r<0?'kapı HAKLI (zarardan korudu)':'kapı para yakıyor OLABİLİR'))+
        '</td></tr>'))
      : '<div class="bos">Açılan gölge işlemler henüz kapanmadı.</div>')+
    '<div class="not">Ortalama R <b>negatif</b> ise o kapı seni zarardan korumuş demektir — dokunma. '+

}

const TF_AD = {'1m':'1d','5m':'5d','15m':'15d','1h':'1s','4h':'4s','1d':'1g','1w':'1h'};
let coinSec = null, coinTf = '1h', coinVeri = null, sembolListe = null;

function coinRota(){
  const p = (location.hash.slice(1)||'').split('/');
  if(p[0]==='coin'){ if(p[1]) coinSec=p[1].toUpperCase(); if(p[2]) coinTf=p[2]; }
}
async function coinYukle(el){
  coinRota();
  if(!sembolListe){
    try{ sembolListe = (await al('/api/semboller')).semboller || []; }catch(e){ sembolListe=[]; }
  }
  const son = JSON.parse(localStorage.getItem('sonCoinler')||'[]');
  el.innerHTML =
  '<section><h2>Coin ara</h2>'+
    '<input id="coinArama" placeholder="sembol yaz (örn. GRVT, SOL, LINK)…" autocomplete="off" '+
      'style="width:100%;max-width:420px;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;'+
      'border:1px solid var(--kenar);background:var(--zemin);color:var(--yazi)">'+
    '<div id="coinSonuc" style="margin-top:8px"></div>'+
    (son.length?'<div class="not">Son bakılanlar: '+son.map(s=>
      '<a href="#coin/'+s+'/1h" onclick="coinAc(\''+s+'\')" style="cursor:pointer">'+s+'</a>').join(' · ')+'</div>':'')+
    '<div class="not">'+sembolListe.length+' vadeli işlem sembolü — botun tarayabildiği evren. '+
    'Tokenleştirilmiş hisseler ve stablecoin\'ler elenmiş.</div></section>'+
  '<div id="coinGovde"></div>';

  const kutu = $('#coinArama');
  kutu.addEventListener('input', ()=>coinFiltre(kutu.value));
  kutu.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const ilk=document.querySelector('#coinSonuc .sonucSatir');
      if(ilk) coinAc(ilk.dataset.sym); }
  });
  if(coinSec) coinDetayYukle();
}
function coinFiltre(q){
  q = (q||'').toUpperCase().trim();
  if(!q){ $('#coinSonuc').innerHTML=''; return; }
  const v = sembolListe.filter(s=>s.sym.includes(q))
    .sort((a,b)=>(a.sym===q?-1:b.sym===q?1:a.sym.indexOf(q)-b.sym.indexOf(q)||b.hacim_musd-a.hacim_musd))
    .slice(0,12);
  $('#coinSonuc').innerHTML = v.length ? '<div class="tablo-sar"><table><tbody>'+v.map(s=>
    '<tr class="sonucSatir" data-sym="'+s.sym+'" style="cursor:pointer" onclick="coinAc(\''+s.sym+'\')">'+
    '<td><b>'+s.sym+'</b></td><td class="sag '+snf(s.chg24)+'">'+isar(s.chg24)+n1(s.chg24)+'%</td>'+
    '<td class="sag sonuk">'+n1(s.hacim_musd)+'M$ hacim</td></tr>').join('')+'</tbody></table></div>'
    : '<div class="bos">Eşleşen sembol yok. (Yalnız vadeli işlemi olan coinler aranabilir.)</div>';
}
function coinAc(sym){
  coinSec = sym; location.hash = 'coin/'+sym+'/'+coinTf;
  const son = JSON.parse(localStorage.getItem('sonCoinler')||'[]').filter(s=>s!==sym);
  son.unshift(sym); localStorage.setItem('sonCoinler', JSON.stringify(son.slice(0,5)));
  $('#coinArama').value=''; $('#coinSonuc').innerHTML='';
  coinDetayYukle();
}
/* Dilim dugmeleri AYRI cizilir: eskiden coinDetayYukle icinde tek sefer basiliyordu,
   dilim degisince secili dugme eski yerde kaliyor ve "hicbir sey olmadi" gibi gorunuyordu. */
function tfDugmeCiz(){
  const el=$('#tfDugmeler'); if(!el) return;
  el.innerHTML='<span class="sonuk" style="font-size:11px">ZAMAN DİLİMİ</span>'+
    Object.keys(TF_AD).map(t=>'<button onclick="coinTfSec(\''+t+'\')"'+
      (t===coinTf?' style="border-color:var(--vurgu);color:var(--vurgu);font-weight:600"':'')+
      '>'+TF_AD[t]+'</button>').join('');
}
function coinTfSec(tf){
  if(tf===coinTf) return;
  coinTf=tf; location.hash='coin/'+coinSec+'/'+tf;
  tfDugmeCiz();
  const n=$('#grafikNot'); if(n) n.innerHTML='<span class="sonuk">'+TF_AD[tf]+' yükleniyor…</span>';
  coinGrafikYukle();
}

/* ALT/BTC PARITESI (2026-08-10) — kullanicinin kendi teknigi, panele olcum olarak girdi.
   Neden ayri bir serit: coinin USD getirisi ile BTC'ye GORE getirisi farkli seylerdir;
   ayni kart dizisine karisirsa tam da acmak istedigi tuzak ("USD'de yesil") gizlenir. */
function altBtcCiz(a){
  if(!a || a.r7==null) return '';
  const guclu = a.r7>0 && (a.r30||0)>0;
  const tuzak = a.r7<=0 && !((a.r30||0)>0) && (a.usd7||0)>0;   // 30g hala onde ise 'tuzak' degil, soguma
  const renk = guclu?'var(--iyi)':(tuzak?'var(--kotu)':'var(--sonuk)');
  const h=(v,ad)=>'<span style="margin-right:14px">'+ad+' <b class="'+snf(v)+'">'+
    (v==null?'–':isar(v)+n1(v)+'%')+'</b></span>';
  return '<div class="satir" style="margin:12px 0 2px;padding:8px 10px;border:1px solid var(--cizgi);'+
    'border-left:3px solid '+renk+';border-radius:6px;display:block">'+
    '<div style="font-size:11px;margin-bottom:4px">'+T('alt_btc',null,'BTC\'YE KARŞI (alt/BTC paritesi)')+'</div>'+
    h(a.r24,'24s')+h(a.r7,'7g')+h(a.r30,'30g')+
    '<span class="sonuk" style="margin-right:14px">USD 7g '+(a.usd7==null?'–':isar(a.usd7)+n1(a.usd7)+'%')+'</span>'+
    '<span style="color:'+renk+'">'+esc(a.yorum||'')+'</span></div>';
}

/* ---- katman anahtarlari: varsayilan SADE, ne istersen ac ----
   2026-08-05: onceden fiyat grafiginde 17 cizgi vardi (3 Bollinger + 2 MA +
   12 yatay seviye) ve grafik okunmuyordu. Artik varsayilan yalniz mum +
   en yakin destek/direnc; digerleri tek tikla aciliyor ve secim hatirlaniyor. */
const KATMAN_VARSAYILAN = {bb:false, ma:false, sr:true, hacim:true, rsi:true};
let katman = Object.assign({}, KATMAN_VARSAYILAN,
  JSON.parse(localStorage.getItem('katmanlar')||'{}'));
function katmanDegis(k){
  katman[k] = !katman[k];
  localStorage.setItem('katmanlar', JSON.stringify(katman));
  coinGrafikYukle();
}
const KATMAN_AD = {bb:'Bollinger', ma:'MA50/200', sr:'Destek/direnç',
                   hacim:'Hacim', rsi:'RSI'};

/* 2026-08-05 HATA (kullanici: "buyuk grafik degismiyor, altta kucuk olan aciliyor"):
   coinGrafikYukle ASENKRON. Temizlik await'ten ONCE yapiliyordu; zaman dilimi
   degistirilince ikinci cagri temizlik yapip beklemeye giriyor, sonra BIRINCI
   cagri donuyor ve grafigini ayni kutuya ciziyordu. Iki grafik ust uste biniyor:
   ustteki eski (degismemis gibi gorunen), yenisi altta kutudan tasarak aciliyor.
   Cozum: (1) jeton — sadece EN SON istek cizer, (2) temizlik cizimden hemen once,
   (3) kutu ayrica bosaltilir, (4) ResizeObserver'lar kapatilir. */
let grafikJeton = 0;
function coinGrafikTemizle(){
  ['gFiyat','gHacim','gRsi'].forEach(id=>{
    const g = grafikler[id];
    if(g){ try{ g.go && g.go.disconnect(); }catch(e){}
           try{ g.c.remove(); }catch(e){}
           delete grafikler[id]; }
    const el = document.getElementById(id);
    if(el) el.innerHTML = '';        // remove() basarisiz olursa artik tuval kalmasin
  });
}
async function coinGrafikYukle(){
  const jeton = ++grafikJeton;
  let d;
  try{ d = await al('/api/coin_mum?sym='+coinSec+'&tf='+coinTf+'&limit=300'); }catch(e){ return; }
  if(jeton !== grafikJeton) return;   // bu arada daha yeni bir dilim secilmis — cizme
  coinGrafikTemizle();
  if(d.hata || !d.mumlar || !d.mumlar.length){ $('#grafikNot').textContent='Mum verisi alınamadı.'; return; }
  const m=d.mumlar, sv=d.seviyeler||{};
  const varMi=a=>a && a.some(v=>v!=null);

  // katman butonlari
  $('#katmanlar').innerHTML = '<span class="sonuk" style="font-size:11px">GÖSTER</span>'+
    Object.keys(KATMAN_AD).map(k=>{
      const yok = (k==='ma' && !varMi(d.ma50) && !varMi(d.ma200));
      return '<button onclick="katmanDegis(\''+k+'\')"'+
        (katman[k]?' style="border-color:var(--vurgu);color:var(--vurgu);font-weight:600"':'')+
        (yok?' disabled title="bu dilimde yeterli mum yok"':'')+'>'+
        (katman[k]?'✓ ':'')+KATMAN_AD[k]+'</button>';}).join('');

  // panel yuksekliklerini katmana gore ayarla
  document.getElementById('gHacim').style.display = katman.hacim?'block':'none';
  document.getElementById('gRsi').style.display   = katman.rsi?'block':'none';

  const yap = id=>{ const el=document.getElementById(id);
    if(!el || el.style.display==='none') return null;
    const c=LightweightCharts.createChart(el, Object.assign(grafikSecenek(),
      {width:el.clientWidth, height:el.clientHeight}));
    // gozlemci saklanir; bir sonraki cizimde disconnect edilir (yoksa birikir)
    const go=new ResizeObserver(()=>{ try{c.applyOptions({width:el.clientWidth,height:el.clientHeight});}catch(e){} });
    go.observe(el);
    grafikler[id]={c:c,el:el,go:go};
    return c; };

  const c1=yap('gFiyat'), c2=yap('gHacim'), c3=yap('gRsi');
  const mum=c1.addCandlestickSeries({upColor:renk('--iyi'),downColor:renk('--kotu'),
    borderVisible:false,wickUpColor:renk('--iyi'),wickDownColor:renk('--kotu')});
  mum.setData(m.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));

  // Eksik degerler ATILMAZ, "bos nokta" olarak birakilir ({time} — deger yok).
  // Atilirsa serinin mum sayisi fiyat grafiginden az olur ve paneller kayik hizalanir.
  const nokta=(v,i)=>v==null?{time:m[i].time}:{time:m[i].time,value:v};
  const cizgi=(c,veri,color,w,stil)=>{ const s=c.addLineSeries({color:color,lineWidth:w||1,
    lineStyle:stil||0, priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    s.setData(veri.map(nokta)); return s; };

  if(katman.bb){
    cizgi(c1,d.bollinger.ust,'#7b7ba8',1);
    cizgi(c1,d.bollinger.orta,'#7b7ba8',1,2);   // orta cizgi KESIKLI -> banttan ayrilir
    cizgi(c1,d.bollinger.alt,'#7b7ba8',1);
  }
  if(katman.ma){
    if(varMi(d.ma50))  cizgi(c1,d.ma50, renk('--uyari'),2);
    if(varMi(d.ma200)) cizgi(c1,d.ma200,renk('--vurgu'),2);
  }
  if(katman.sr){
    // YALNIZ en yakin bir direnc + bir destek (etiketli). Fazlasi grafigi bogar.
    // Etikete dokunus sayisi yazilir: "direnç ×4" = fiyat oradan 4 kez donmus.
    const dr=(sv.direncler||[])[0], ds0=(sv.destekler||[])[0];
    if(dr) mum.createPriceLine({price:dr.fiyat,color:renk('--kotu'),lineWidth:1,
      lineStyle:2,axisLabelVisible:true,title:'direnç ×'+dr.dokunus});
    if(ds0) mum.createPriceLine({price:ds0.fiyat,color:renk('--iyi'),lineWidth:1,
      lineStyle:2,axisLabelVisible:true,title:'destek ×'+ds0.dokunus});
  }

  if(c2){ const hac=c2.addHistogramSeries({priceLineVisible:false});
    hac.setData(m.map(x=>({time:x.time,value:x.volume,
      color:(x.close>=x.open?renk('--iyi'):renk('--kotu'))+'88'}))); }
  if(c3){ const rs=c3.addLineSeries({color:renk('--vurgu'),lineWidth:2,priceLineVisible:false});
    rs.setData(d.rsi.map(nokta));
    [30,70].forEach(v=>rs.createPriceLine({price:v,color:renk('--yazi3'),lineWidth:1,
      lineStyle:2,axisLabelVisible:true,title:String(v)})); }

  // Once hepsini oturt, sonra FIYAT grafiginin araligini olcut alarak esitle.
  // 'esitleniyor' bayragi olmazsa geri bildirim dongusune girip birbirlerini iterler.
  const hepsi=[c1,c2,c3].filter(Boolean);
  hepsi.forEach(c=>c.timeScale().fitContent());
  const ana=c1.timeScale().getVisibleLogicalRange();
  if(ana) hepsi.forEach(o=>{ if(o!==c1) try{o.timeScale().setVisibleLogicalRange(ana);}catch(e){} });
  let esitleniyor=false;
  hepsi.forEach(c=>{
    c.timeScale().subscribeVisibleLogicalRangeChange(rg=>{
      if(!rg || esitleniyor) return;
      esitleniyor=true;
      hepsi.forEach(o=>{ if(o!==c) try{o.timeScale().setVisibleLogicalRange(rg);}catch(e){} });
      esitleniyor=false; }); });

  const sonRsi=[...d.rsi].reverse().find(v=>v!=null);
  const oge=(renkV,ad,terim,deger,sinif)=>'<span class="oge">'+
    '<i class="'+(sinif||'')+'" style="border-top-color:'+renkV+';'+
    (sinif==='kutu'?'background:'+renkV+';':'')+'"></i>'+
    (terim?T(terim,deger,ad):ad)+'</span>';
  let lg = oge(renk('--iyi'),'yükselen',null,null,'kutu')+oge(renk('--kotu'),'düşen',null,null,'kutu');
  if(katman.bb) lg += oge('#7b7ba8','Bollinger (20 mum ±2σ, orta çizgi kesikli)','bollinger');
  if(katman.ma){
    if(varMi(d.ma50))  lg += oge(renk('--uyari'),'MA50','ma50_200');
    if(varMi(d.ma200)) lg += oge(renk('--vurgu'),'MA200','ma50_200');
    else lg += '<span class="oge sonuk"><i style="border-top-color:var(--yazi3)"></i>MA200 — bu dilimde 200 mum yok</span>';
  }
  if(katman.sr){
    const dr=(sv.direncler||[])[0], ds0=(sv.destekler||[])[0];
    lg += oge(renk('--kotu'),'direnç '+(dr?dr.fiyat+' (×'+dr.dokunus+')':'– yok'),'destek_direnc',null,'kesik')+
          oge(renk('--iyi'),'destek '+(ds0?ds0.fiyat+' (×'+ds0.dokunus+')':'– yok'),'destek_direnc',null,'kesik');
  }
  if(katman.rsi) lg += oge(renk('--vurgu'),'RSI ('+n1(sonRsi)+')','rsi',sonRsi);
  $('#grafikLegend').innerHTML = lg;

  const dd=(sv.direncler||[]).length, ds=(sv.destekler||[]).length;
  $('#grafikNot').innerHTML =
    '<b>'+TF_AD[coinTf]+'</b> dilimi · '+m.length+' mum · '+
    'Bollinger ve hareketli ortalamalar <b>bu dilimin</b> mumlarını kullanıyor — '+
    'yani burada "20 mum" = <b>20 × '+TF_AD[coinTf]+'</b>. '+
    'Botun kendi hesapları ise her zaman <b>1 saatlik</b> mumdan (aşağıdaki kutular).'+
    (katman.sr && (dd+ds)>0 ? '<br>Grafikte yalnız <b>en yakın</b> destek ve direnç çizili; '+
      'diğer seviyeler aşağıdaki "Seviyeler" bölümünde listeli.' : '');

  // grafikte cizilmeyen seviyeler tabloda gorunsun
  const sl=$('#seviyeListe');
  if(sl){
    const sat=(sv.direncler||[]).map(v=>['direnç',v]).concat((sv.destekler||[]).map(v=>['destek',v]))
      .sort((a,b)=>b[1].fiyat-a[1].fiyat)
      .map(x=>'<tr><td class="'+(x[0]==='direnç'?'kotu':'iyi')+'">'+x[0]+'</td>'+
        '<td class="sag">'+x[1].fiyat+'</td>'+
        '<td class="sag">'+(x[1].dokunus>1?'<b>'+x[1].dokunus+' kez</b>':'1 kez')+'</td>'+
        '<td class="sag sonuk">'+isar(x[1].uzaklik_pct)+n1(x[1].uzaklik_pct)+'%</td></tr>');
    sl.innerHTML = tablo(['<th>Tür</th><th class="sag">Seviye</th>'+
      '<th class="sag">'+T('dokunus',null,'Dokunuş')+'</th><th class="sag">Fiyata uzaklık</th>'],
      sat, 'Bu dilimde yapısal seviye bulunamadı.')+
      '<div class="not">'+TF_AD[coinTf]+' mumlarının dönüş noktaları, '+
      (sv.bant!=null?'<b>±'+sv.bant+'</b> genişliğinde ':'')+'bölgelere toplanır; '+
      'her satır bir bölge, "dokunuş" o bölgeden kaç kez dönüldüğü. '+
      'Çok dokunulan seviye daha güçlüdür.'+
      (sv.bot_direnc!=null||sv.bot_destek!=null ?
        '<br>Botun stopu bunları değil, <b>1 saatlik tek en yakın dönüş noktasını</b> kullanır'+
        ' (bu dilimde: direnç '+(sv.bot_direnc!=null?sv.bot_direnc:'–')+
        ' / destek '+(sv.bot_destek!=null?sv.bot_destek:'–')+').' : '')+'</div>';
  }
}

  const d=coinVeri; if(!d) return;
  yon = yon || (d.bot_gorusu||{}).karar_yon_secili || 'SHORT';
  const olc=(d.olcucu||{})[yon.toLowerCase()]||{};
  const eq=d.equity_benim!=null?d.equity_benim:10000;
  $('#islemForm').innerHTML =
  '<div class="satir" style="margin-bottom:10px">'+
    '<button onclick="islemFormCiz(\'LONG\')" '+(yon==='LONG'?'style="border-color:var(--iyi);color:var(--iyi)"':'')+'>LONG</button>'+
    '<button onclick="islemFormCiz(\'SHORT\')" '+(yon==='SHORT'?'style="border-color:var(--kotu);color:var(--kotu)"':'')+'>SHORT</button>'+
    '<span class="sonuk">bakiyem '+para(eq)+'$</span></div>'+
  (olc.hata?'<div class="bos kotu">Ölçücü bu yön için seviye üretemedi: '+esc(olc.hata)+'</div>':
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px">'+
    ['giris|Giriş|'+ (olc.giris||''),'stop|'+'Stop|'+(olc.stop||''),
     'tp1|TP1|'+(olc.tp1||''),'tp2|TP2|'+(olc.tp2||'')].map(x=>{const a=x.split('|');
      return '<div><div class="etiket sonuk" style="font-size:11px">'+a[1]+'</div>'+
      '<input id="if-'+a[0]+'" type="number" step="any" value="'+a[2]+'" '+
      (a[0]==='giris'?'disabled ':'')+'oninput="boyutHesapla()" '+
      'style="width:100%;font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;'+
      'border:1px solid var(--kenar);background:var(--zemin);color:var(--yazi)"></div>';}).join('')+
  '</div>'+
  '<div style="margin-bottom:10px"><div class="etiket sonuk" style="font-size:11px">'+
    T('tez',null,'Giriş tezim')+' — neden giriyorum, neyi bekliyorum, ne beni yanıltır</div>'+
    '<textarea id="if-tez" rows="2" placeholder="örn. BTC payı düşüyor, altlar geri kalmış, 0.34 direncinden dönüş bekliyorum; 0.35 üstü kapanış tezi çürütür" '+
    'style="width:100%;font:inherit;font-size:13px;padding:6px 9px;border-radius:6px;'+
    'border:1px solid var(--kenar);background:var(--zemin);color:var(--yazi);resize:vertical"></textarea></div>'+
  '<div id="boyutOnizleme" class="not"></div>'+
  '<div class="satir" style="margin-top:10px">'+
    '<button onclick="islemAc(\''+yon+'\')" style="border-color:var(--vurgu);padding:8px 18px">SANAL İŞLEM AÇ</button>'+
    '<span class="sonuk">gerçek borsa emri değil — kâğıt üstü</span></div>');
  if(!olc.hata) boyutHesapla();
}
function boyutHesapla(){
  const d=coinVeri; if(!d) return;
  const giris=parseFloat($('#if-giris').value), stop=parseFloat($('#if-stop').value),
        tp1=parseFloat($('#if-tp1').value);
  const eq=d.equity_benim!=null?d.equity_benim:10000;
  if(!giris||!stop||giris===stop){ $('#boyutOnizleme').textContent='Giriş ve stop gerekli.'; return; }
  const sf=Math.abs(giris-stop)/giris;
  const hedefRisk=eq*d.islem_risk_pct/100;
  const marjin=eq*d.marjin_pct;
  let kald=Math.round(Math.max(d.kaldirac_min, Math.min(d.kaldirac_max, (hedefRisk/sf)/marjin)));
  let notional=marjin*kald, risk=sf*notional, m2=marjin;
  if(risk>hedefRisk){ const k=hedefRisk/risk; notional*=k; m2*=k; risk=hedefRisk; }
  const rr = tp1 ? Math.abs(tp1-giris)/Math.abs(giris-stop) : null;
  $('#boyutOnizleme').innerHTML =
    'Bot hesapladı: hedef risk <b>'+para(hedefRisk)+'$</b> (%'+d.islem_risk_pct+') · stop mesafesi <b>%'+
    n2(sf*100)+'</b> → büyüklük <b>'+para(notional)+'$</b> · teminat <b>'+para(m2)+'$</b> · kaldıraç <b>'+kald+'x</b>'+
    ' · gerçek risk <b>'+para(risk)+'$</b>'+
    (rr!=null?' · '+T('rr_net',null,'ödül/risk')+' <b class="'+(rr>=2?'iyi':'uyari')+'">'+n2(rr)+
      '</b>'+(rr<2?' ⚠ botun 2,0 eşiğinin altında':''):'');
}
async function islemAc(yon){
  const d=coinVeri;
  const stop=parseFloat($('#if-stop').value), tp1=parseFloat($('#if-tp1').value), tp2=parseFloat($('#if-tp2').value);
  const tez=$('#if-tez').value.trim();
  const olc=(d.olcucu||{})[yon.toLowerCase()]||{};
  const elle = (stop!==olc.stop || tp1!==olc.tp1 || tp2!==olc.tp2);
  const bg=d.bot_gorusu||{};
  const atlanan=(bg.vetolar||[]).map(v=>'• '+(VETO_AD[v.kategori]||v.kategori)).join('\n');
  let soru = d.sym+' '+yon+' — SANAL işlem açılsın mı?\n\n'+$('#boyutOnizleme').textContent.replace(/ · /g,'\n');
  if(!bg.karar || !bg.ayni_yonde) soru += '\n\n⚠ BOT BU İŞLEMİ AÇMAZDI.';
  if(atlanan) soru += '\nGörmezden gelinen kapılar:\n'+atlanan;
  if(elle) soru += '\n\nStop/hedef ölçücünün önerdiğinden farklı — elle değiştirildi olarak kaydedilecek.';
  if(!tez) soru += '\n\nGiriş tezi boş. Sonradan "neden girmiştim" sorusunu cevaplayamazsın.';
  if(!confirm(soru)) return;
  const r = await gonder('/api/benim_islem', {sym:d.sym, yon:yon, tez:tez,
    stop:elle?stop:null, tp1:elle?tp1:null, tp2:elle?tp2:null});
  tost(r.mesaj, r.ok);
  if(r.ok){ SEKMELER.forEach(s=>s._son=0); coinDetayYukle(); ustBar(); }
}

      ['Radar kaydı', g.radar_toplam],
      ['Botun aday listesinde', g.aday_toplam],
      ['En yüksek '+'skor', g.skor_max!=null?n1(g.skor_max):'–'],

    ].map(k=>'<div class="kart"><div class="etiket">'+k[0]+'</div><div class="deger">'+k[1]+'</div></div>').join('')+'</div>'+
    tablo(['<th>Zaman</th><th class="sag">'+T('skor',null,'Skor')+'</th><th>'+T('stage',null,'Aşama')+'</th>',
      '<th class="sag">Fiyat</th><th>Botun kararı</th>'],

        '<td class="sag" data-terim="skor" data-deger="'+a.score+'">'+n1(a.score)+'</td>'+
        '<td>'+esc(a.stage)+'</td><td class="sag sonuk">'+(a.price!=null?a.price:'–')+'</td>'+
        '<td class="sonuk">'+esc(a.karar||'')+'</td></tr>'),

    'havuzuna kaç kez girdi (ikisi farklı evrenler).</div>';
}

/* =========================================================================
   BOT vs BEN
   ========================================================================= */
async function karsYukle(el){
  const r = await Promise.all([al('/api/karsilastirma'), al('/api/benim')]);
  const k=r[0], ben=r[1];
  const b=k.bot||{}, n=k.ben||{};
  const sut=(ad,x)=>'<td class="sag">'+x+'</td>';
  el.innerHTML =
  (ben.var
    ? '<section><h2>Açık pozisyonlarım <span class="rozet uyari">SANAL</span></h2>'+
      tablo(['<th>Coin</th><th>Yön</th><th class="sag">'+T('kaldirac',null,'Kald.')+'</th>',
        '<th class="sag">'+T('marjin',null,'Teminat')+'</th><th class="sag">Giriş</th>',
        '<th class="sag">Anlık</th><th class="sag">Kâr/Zarar</th><th class="sag">'+T('stop',null,'Stop')+'</th>',
        '<th>Bot ne demişti</th><th>'+T('tez',null,'Tezim')+'</th><th></th>'],
        (ben.acik_pozisyonlar||[]).map(p=>{ const bg=p.bot_gorusu||{};
          return '<tr><td><b>'+esc(p.sym)+'</b></td>'+
          '<td class="'+(p.yon==='LONG'?'iyi':'kotu')+'">'+p.yon+'</td>'+
          '<td class="sag">'+p.kaldirac+'x</td><td class="sag">'+para(p.marjin)+'$</td>'+
          '<td class="sag">'+p.giris+'</td><td class="sag">'+p.anlik_fiyat+'</td>'+
          '<td class="sag '+snf(p.acik_pnl)+'">'+isar(p.acik_pnl)+para(p.acik_pnl)+'$</td>'+
          '<td class="sag">'+p.stop+'</td>'+
          '<td class="'+(bg.ayni_yonde?'sonuk':'uyari')+'">'+(bg.ayni_yonde?'onaylardı':'AÇMAZDI')+'</td>'+
          '<td class="sonuk" style="white-space:normal;max-width:280px">'+esc(p.tez||'—')+'</td>'+
          '<td><button onclick="benimKapat(\''+p.sym+'\')">kapat</button></td></tr>';}),
        'Açık pozisyonun yok. Coin Ara sekmesinden açabilirsin.')+
      '<div class="not">Bu pozisyonlar botun turuyla, <b>botla aynı kurallarla</b> yönetiliyor '+
      '(stop, TP1 kısmi, iz süren stop, zaman stopu, fonlama) — panel kapalıyken de.</div></section>'
    : '<section><div class="bos">Kendi hesabın henüz açılmadı. '+
      '<b>Coin Ara</b> sekmesinden ilk sanal işlemini açtığında oluşur.</div></section>')+
  '<section><h2>İki sistem yan yana</h2>'+
    tablo(['<th></th><th class="sag">BOT (otomatik)</th><th class="sag">BEN (elle)</th>'],
      [['Bakiye', b.equity!=null?para(b.equity)+'$':'–', n.equity!=null?para(n.equity)+'$':'–'],
       ['Kapanan işlem', b.n, n.n],
       ['Kazanan', b.kazanan+(b.win_rate!=null?' (%'+b.win_rate+')':''), n.kazanan+(n.win_rate!=null?' (%'+n.win_rate+')':'')],
       ['Toplam kâr/zarar', isar(b.pnl)+para(b.pnl)+'$', isar(n.pnl)+para(n.pnl)+'$'],
       ['Ortalama R', b.ort_r!=null?b.ort_r:'–', n.ort_r!=null?n.ort_r:'–'],
       ['En kötü düşüş', '%'+n1(b.maks_dusus), '%'+n1(n.maks_dusus)]
      ].map(r=>'<tr><td>'+r[0]+'</td>'+sut(0,r[1])+sut(0,r[2])+'</tr>'))+
    '<div class="grafik" id="g-kars" style="margin-top:12px"></div>'+
    '<div class="not">İki kasa tamamen ayrı. Çıkış kuralları (stop, TP, iz süren, zaman stopu) '+
    '<b>aynı</b> — yani aradaki fark yalnızca <b>giriş kararından</b> geliyor.</div></section>'+

  '<section><h2>'+T('bota_ragmen',null,'Botu dinlemek işe yarıyor mu?')+'</h2>'+
    tablo(['<th></th><th class="sag">İşlem</th><th class="sag">Kazanan</th><th class="sag">Kâr/Zarar</th><th class="sag">Ort. R</th>'],
      [['Bot da aynı yönü söylediğinde', k.bot_onayladi],
       ['Bota rağmen girdiğimde', k.bota_ragmen]
      ].map(r=>'<tr><td>'+r[0]+'</td><td class="sag">'+r[1].n+'</td>'+
        '<td class="sag">'+r[1].kazanan+'</td>'+
        '<td class="sag '+snf(r[1].pnl)+'">'+isar(r[1].pnl)+para(r[1].pnl)+'$</td>'+
        '<td class="sag '+snf(r[1].ort_r)+'">'+(r[1].ort_r!=null?r[1].ort_r:'–')+'</td></tr>'))+
    '<div class="not">'+T('karsi_olgu',null,'Karşı olgu')+': bota rağmen açtığın '+
      k.karsi_olgu_1.n+' işlem toplam <b class="'+snf(k.karsi_olgu_1.toplam)+'">'+
      isar(k.karsi_olgu_1.toplam)+para(k.karsi_olgu_1.toplam)+'$</b> yaptı — '+
      'botu dinleseydin bu tutar hiç oluşmayacaktı.<br>'+
      'Bot bu dönemde '+k.karsi_olgu_2.bot_islem+' işlem açtı, sen '+k.karsi_olgu_2.benim_islem+' işlem açtın.</div>'+
    (k.yeterli_mi ? '' :
      '<div class="not uyari" style="margin-top:10px">⚠ Henüz <b>'+(k.ben.n||0)+'</b> kapanan işlem var. '+
      'Bu sayılar 25-30 işleme kadar <b>izlenimdir, kanıt değil</b> — bu projede tek pencereden '+
      'çıkarılan sonuçların defalarca çürüdüğü ölçüldü.</div>')+
  '</section>';

  const bs=seriHazirla(k.bot_equity_serisi||[],'ts','equity');
  const ns=seriHazirla(k.ben_equity_serisi||[],'ts','equity');
  const el2=document.getElementById('g-kars');
  if(el2 && bs.length){
    if(grafikler.kars){ try{grafikler.kars.c.remove();}catch(e){} }
    const c=LightweightCharts.createChart(el2, Object.assign(grafikSecenek(),
      {width:el2.clientWidth,height:el2.clientHeight}));
    const s1=c.addLineSeries({color:renk('--yazi3'),lineWidth:2,title:'BOT'}); s1.setData(bs);
    if(ns.length){ const s2=c.addLineSeries({color:renk('--vurgu'),lineWidth:2,title:'BEN'}); s2.setData(ns); }
    c.timeScale().fitContent(); grafikler.kars={c:c};
    new ResizeObserver(()=>{ try{c.applyOptions({width:el2.clientWidth,height:el2.clientHeight});}catch(e){} }).observe(el2);
  }
}

async function benimKapat(sym){
  if(!confirm(sym+' pozisyonu ŞU ANKİ piyasa fiyatından kapatılsın mı?\n\nBu geri alınamaz.')) return;
  const r = await gonder('/api/benim_kapat',{sym:sym});
  tost(r.mesaj, r.ok);
  if(r.ok){ SEKMELER.forEach(s=>s._son=0); sekmeAc('kars'); ustBar(); }
}

async function ayarYukle(el){
  const a = await al('/api/ayarlar');
  el.innerHTML =
  '<section><h2>Bot kontrolü</h2><div class="satir">'+
    '<button onclick="kontrol(\'bot_durdur\',\'Bot DURDURULSUN mu?\\n\\nAçık pozisyonlar açık kalır, yeni giriş yapılmaz.\')">Botu durdur</button>'+
    '<button onclick="kontrol(\'bot_devam\',\'Bot yeniden ÇALIŞSIN mı?\')">Devam ettir</button>'+
    '<span style="width:18px"></span>'+
    '<button onclick="kontrol(\'bildirim_ac\',\'Bildirimler AÇILSIN mı? (Telegram + masaüstü)\')">Bildirimleri aç</button>'+
    '<button onclick="kontrol(\'bildirim_kapa\',\'Bildirimler KAPATILSIN mı?\')">Bildirimleri kapat</button>'+
    '<span class="rozet '+(a.bildirim_acik?'iyi':'')+'">'+(a.bildirim_acik?'bildirim açık':'bildirim kapalı')+'</span>'+
  '</div><div class="not">Bot ayrı bir süreç olarak tur tur çalışıyor; değişiklik bir sonraki turda geçerli olur.</div></section>'+

  '<section><h2>Eşikler</h2>'+
    '<div class="not" style="margin:0 0 14px">Yalnızca aşağıdaki ayarlar panelden değiştirilebilir. '+
    'API anahtarları ve Telegram bilgileri panele hiç okunmuyor. '+
    'Her değişiklik <b>panel_islem_log.jsonl</b> dosyasına yazılır.</div>'+
    (a.ayarlar||[]).map(x=>'<div class="ayar">'+
      '<div><div class="ad">'+esc(x.ad)+'</div><div class="ack">'+esc(x.aciklama)+'</div></div>'+
      '<input id="ay-'+x.anahtar.replace(/\./g,'_')+'" type="number" step="any" value="'+
        (x.deger!=null?x.deger:'')+'">'+
      '<button onclick="ayarKaydet(\''+x.anahtar+'\')">Kaydet</button></div>').join('')+
  '</section>'+

  '<section><h2>Panelden yapılan değişiklikler</h2>'+
    tablo(['<th>Zaman</th><th>Ne</th><th>Eski</th><th>Yeni</th>'],
      (a.iz||[]).map(i=>'<tr><td class="sonuk">'+esc((i.ts||'').slice(0,16))+'</td>'+
        '<td>'+esc(i.anahtar||i.eylem)+'</td><td class="sonuk">'+esc(i.eski)+'</td>'+
        '<td><b>'+esc(i.yeni)+'</b></td></tr>'), 'Henüz panelden değişiklik yapılmadı.')+'</section>';
}
async function kontrol(eylem, soru){
  if(!confirm(soru)) return;
  const r = await gonder('/api/kontrol',{eylem:eylem});
  tost(r.mesaj, r.ok);
  if(r.ok) hepsiniYenile();
}
async function ayarKaydet(anahtar){
  const el = document.getElementById('ay-'+anahtar.replace(/\./g,'_'));
  if(!confirm('Bu ayar '+el.value+' olarak kaydedilsin mi?\n\nBotun davranışını bir sonraki turdan itibaren değiştirir.')) return;
  const r = await gonder('/api/ayar',{anahtar:anahtar, deger:el.value});
  tost(r.mesaj, r.ok);
  const s = SEKMELER.find(x=>x.id==='ayarlar'); s._son=0; ayarYukle($('#p-ayarlar'));
}

setInterval(function(){ const s=SEKMELER.find(x=>x.id===aktifSekme); if(s && s.sure) yenile(s); }, 30000);
